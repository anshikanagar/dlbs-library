<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOLIO — Modern Digital Library System</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #fafaf9;
      color: #18181b;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    @media print {
      body { background: white; }
      header, footer, button, .no-print { display: none !important; }
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-900">

  <!-- Modern Frosted Navbar -->
  <header class="glass-nav border-b border-zinc-200/80 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer group" onclick="navigate('dashboard')">
        <div class="w-9 h-9 rounded-xl bg-zinc-900 text-white flex items-center justify-center shadow-sm group-hover:bg-indigo-600 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
        <div class="flex items-center space-x-2">
          <span class="font-extrabold text-lg tracking-tight text-zinc-900">DLMS</span>
          <span class="hidden sm:inline-block text-[11px] bg-zinc-100 text-zinc-600 border border-zinc-200/80 px-2 py-0.5 rounded-full font-semibold">IHM Meerut</span>
        </div>
      </div>

      <div id="nav-links" class="flex items-center space-x-1 sm:space-x-2 text-sm font-medium">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </header>

  <!-- Toast Notification Banner -->
  <div id="alert-banner" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 hidden"></div>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full" id="app-container">
    <!-- Active view injected here -->
  </main>

  <!-- Minimalist Institutional Footer -->
  <footer class="bg-white border-t border-zinc-200/80 text-zinc-500 py-6 text-xs mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-2">
      <div class="font-medium text-zinc-700">
        Digital Library Management System • <span class="text-zinc-400">BCA-508 Minor Project</span>
      </div>
      <div class="text-center sm:text-right text-zinc-500">
        Developed by <strong class="text-zinc-800 font-semibold">Anshika Nagar</strong> (240927106007) • Mentor: <strong class="text-zinc-800 font-semibold">Mr. Porash</strong> • C.C.S. University, Meerut
      </div>
    </div>
  </footer>

  <!-- Application Logic -->
  <script>
    const defaultData = {
      adminPassword: "admin123",
      currentUser: { id: 1, name: "Chief Librarian (Mr. Porash)", role: "ADMIN", email: "librarian@ihmmeerut.ac.in", username: "admin" },
      categories: [
        { id: 1, name: "Computer Science" },
        { id: 2, name: "Information Technology" },
        { id: 3, name: "Management & Commerce" },
        { id: 4, name: "Mathematics & Statistics" }
      ],
      books: [
        { id: 1, isbn: "978-0072958867", title: "Database System Concepts", author: "Abraham Silberschatz, Henry Korth", publisher: "McGraw-Hill", edition: "7th Edition", categoryId: 1, total: 5, available: 4, shelf: "Rack-CS-01" },
        { id: 2, isbn: "978-9352607310", title: "Programming with Java: A Primer", author: "E. Balagurusamy", publisher: "Tata McGraw-Hill", edition: "6th Edition", categoryId: 1, total: 8, available: 6, shelf: "Rack-CS-02" },
        { id: 3, isbn: "978-0133591620", title: "Operating System Concepts", author: "Abraham Silberschatz, Peter Galvin", publisher: "Wiley", edition: "10th Edition", categoryId: 1, total: 4, available: 3, shelf: "Rack-CS-03" },
        { id: 4, isbn: "978-0132126953", title: "Computer Networks", author: "Andrew S. Tanenbaum", publisher: "Pearson", edition: "5th Edition", categoryId: 2, total: 6, available: 6, shelf: "Rack-IT-01" },
        { id: 5, isbn: "978-0071267823", title: "Software Engineering: A Practitioner's Approach", author: "Roger S. Pressman", publisher: "McGraw-Hill", edition: "8th Edition", categoryId: 1, total: 5, available: 4, shelf: "Rack-CS-04" },
        { id: 6, isbn: "978-0070669116", title: "Discrete Mathematics and Its Applications", author: "Kenneth H. Rosen", publisher: "McGraw-Hill", edition: "7th Edition", categoryId: 4, total: 4, available: 4, shelf: "Rack-MA-01" },
        { id: 7, isbn: "978-8121924559", title: "Principles and Practice of Management", author: "L.M. Prasad", publisher: "Sultan Chand", edition: "9th Edition", categoryId: 3, total: 3, available: 3, shelf: "Rack-MG-01" }
      ],
      members: [
        { id: 2, name: "Anshika Nagar (BCA-V)", email: "priya.bca@ihmmeerut.ac.in", phone: "9812345678", username: "anshika_nagar", password: "qwerty", role: "MEMBER", status: "ACTIVE" },
        { id: 3, name: "Rahul Verma (BCA-V)", email: "rahul.bca@ihmmeerut.ac.in", phone: "9823456789", username: "rahul_verma", password: "student123", role: "MEMBER", status: "ACTIVE" },
        { id: 4, name: "Amit Kumar (BCA-III)", email: "amit.bca@ihmmeerut.ac.in", phone: "9834567890", username: "amit_kumar", password: "student123", role: "MEMBER", status: "ACTIVE" }
      ],
      issues: [
        { id: 1, bookId: 1, userId: 2, issueDate: "2026-10-15", dueDate: "2026-10-29", returnDate: "2026-10-28", fine: 0.00, status: "RETURNED", remarks: "Returned on schedule" },
        { id: 2, bookId: 2, userId: 2, issueDate: "2026-10-10", dueDate: "2026-10-24", returnDate: "2026-10-27", fine: 15.00, status: "RETURNED", remarks: "3 days late; fine settled" },
        { id: 3, bookId: 2, userId: 3, issueDate: "2026-11-01", dueDate: "2026-11-15", returnDate: null, fine: 0.00, status: "ISSUED", remarks: "Active student loan" },
        { id: 4, bookId: 3, userId: 4, issueDate: "2026-10-20", dueDate: "2026-11-03", returnDate: null, fine: 55.00, status: "OVERDUE", remarks: "11 days overdue" },
        { id: 5, bookId: 5, userId: 2, issueDate: "2026-11-05", dueDate: "2026-11-19", returnDate: null, fine: 0.00, status: "ISSUED", remarks: "Active semester loan" }
      ],
      requests: []
    };

    function checkAndUpdateOverdues(data) {
      const todayStr = new Date().toISOString().split("T")[0];
      data.issues.forEach(i => {
        if (i.status === "ISSUED" && i.dueDate < todayStr) {
          i.status = "OVERDUE";
          const diffTime = new Date() - new Date(i.dueDate);
          const overdueDays = Math.max(1, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
          i.fine = overdueDays * 5.00;
          i.remarks = `${overdueDays} days overdue`;
        }
      });
    }

    function getStore() {
      const saved = localStorage.getItem("DLMS_STORAGE_V4");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (!parsed.adminPassword) parsed.adminPassword = "admin123";
          if (!parsed.requests) parsed.requests = [];
          if (parsed.members) {
            parsed.members.forEach(m => { if (!m.password) m.password = "student123"; });
          }
          checkAndUpdateOverdues(parsed);
          return parsed;
        } catch (e) { console.error(e); }
      }
      checkAndUpdateOverdues(defaultData);
      localStorage.setItem("DLMS_STORAGE_V4", JSON.stringify(defaultData));
      return defaultData;
    }

    function saveStore(data) {
      localStorage.setItem("DLMS_STORAGE_V4", JSON.stringify(data));
    }

    let state = getStore();
    let currentView = "dashboard";
    let loginRoleTab = "ADMIN"; 
    let catalogKeyword = "";
    let catalogCat = 0;

    function showAlert(msg, isSuccess = true) {
      const banner = document.getElementById("alert-banner");
      banner.className = `max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 block no-print`;
      banner.innerHTML = `<div class="px-4 py-3 rounded-xl border text-sm font-medium flex justify-between items-center shadow-sm transition-all ${isSuccess ? 'bg-emerald-50/90 border-emerald-200 text-emerald-900' : 'bg-rose-50/90 border-rose-200 text-rose-900'}">
        <div class="flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full ${isSuccess ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
          <span>${msg}</span>
        </div>
        <button onclick="this.parentElement.remove()" class="text-xs font-semibold px-2 py-1 rounded-lg hover:bg-black/5 text-zinc-500">Dismiss</button>
      </div>`;
      setTimeout(() => { if (banner) banner.innerHTML = ""; }, 4500);
    }

    function navBtnClass(viewName) {
      return currentView === viewName
        ? 'bg-zinc-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition'
        : 'text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 px-3 py-1.5 rounded-lg text-xs font-semibold transition';
    }

    function updateNavbar() {
      const nav = document.getElementById("nav-links");
      const u = state.currentUser;
      if (!u) {
        nav.innerHTML = `
          <button onclick="openLoginWithRole('STUDENT')" class="text-zinc-600 hover:text-zinc-900 px-3 py-1.5 text-xs font-semibold transition">Student Portal</button>
          <button onclick="openLoginWithRole('ADMIN')" class="bg-zinc-900 hover:bg-zinc-800 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm transition">Admin Access</button>
        `;
        return;
      }

      let links = `
        <button onclick="navigate('dashboard')" class="${navBtnClass('dashboard')}">Overview</button>
        <button onclick="navigate('catalog')" class="${navBtnClass('catalog')}">Catalog</button>
      `;

      if (u.role === 'ADMIN') {
        const pendingCount = state.requests.filter(r => r.status === 'PENDING').length;
        links += `
          <button onclick="navigate('adminRequests')" class="${navBtnClass('adminRequests')} flex items-center space-x-1.5">
            <span>Requests</span>
            ${pendingCount > 0 ? `<span class="bg-indigo-500 text-white font-bold px-1.5 py-0.2 rounded-full text-[10px]">${pendingCount}</span>` : ''}
          </button>
          <button onclick="navigate('issueForm')" class="${navBtnClass('issueForm')}">Direct Issue</button>
          <button onclick="navigate('members')" class="${navBtnClass('members')}">Members</button>
          <button onclick="navigate('reports')" class="${navBtnClass('reports')}">Audit Log</button>
        `;
      } else {
        links += `
          <button onclick="navigate('studentProfile')" class="${navBtnClass('studentProfile')}">My Profile</button>
        `;
      }

      links += `
        <div class="flex items-center space-x-2 pl-3 ml-2 border-l border-zinc-200">
          <div class="hidden md:flex items-center space-x-1.5 bg-zinc-100 border border-zinc-200/80 text-zinc-700 text-xs px-2.5 py-1 rounded-full font-medium">
            <span class="w-1.5 h-1.5 rounded-full ${u.role === 'ADMIN' ? 'bg-indigo-600' : 'bg-emerald-500'}"></span>
            <span>${u.name.split('(')[0].trim()}</span>
          </div>
          <button onclick="switchRole()" class="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200/80 text-xs px-2.5 py-1.5 rounded-lg font-semibold transition" title="Switch POV">Switch POV</button>
          <button onclick="logout()" class="text-zinc-500 hover:text-rose-600 hover:bg-rose-50 text-xs px-2.5 py-1.5 rounded-lg font-semibold transition">Logout</button>
        </div>
      `;

      nav.innerHTML = links;
    }

    function openLoginWithRole(role) {
      loginRoleTab = role;
      navigate('login');
    }

    function switchRole() {
      if (state.currentUser.role === 'ADMIN') {
        state.currentUser = { ...state.members[0] };
        showAlert(`Switched to Student View: ${state.currentUser.name}`);
      } else {
        state.currentUser = { id: 1, name: "Chief Librarian (Mr. Porash)", role: "ADMIN", email: "librarian@ihmmeerut.ac.in", username: "admin" };
        showAlert("Switched to Librarian Admin View");
      }
      saveStore(state);
      navigate('dashboard');
    }

    function logout() {
      state.currentUser = null;
      saveStore(state);
      navigate('login');
      showAlert("Signed out safely.");
    }

    function togglePasswordVisibility(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (!input || !btn) return;
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Hide";
      } else {
        input.type = "password";
        btn.textContent = "Show";
      }
    }

    function login(username, password) {
      const cleanUser = username.trim();
      if (loginRoleTab === 'ADMIN') {
        if (cleanUser === 'admin' && password === (state.adminPassword || 'admin123')) {
          state.currentUser = { id: 1, name: "Chief Librarian (Mr. Porash)", role: "ADMIN", email: "librarian@ihmmeerut.ac.in", username: "admin" };
          saveStore(state);
          showAlert("Welcome back, Mr. Porash.");
          navigate('dashboard');
        } else {
          showAlert("Invalid administrator credentials.", false);
        }
      } else {
        const member = state.members.find(m => (m.username === cleanUser || m.email === cleanUser) && m.password === password);
        if (member) {
          state.currentUser = { ...member };
          saveStore(state);
          showAlert(`Welcome back, ${member.name}.`);
          navigate('dashboard');
        } else {
          showAlert("Invalid student username or password.", false);
        }
      }
    }

    function resetPassword(identifier, newPassword, confirmPassword) {
      const cleanId = identifier.trim();
      if (newPassword.length < 4) {
        showAlert("Password must be at least 4 characters long.", false);
        return;
      }
      if (newPassword !== confirmPassword) {
        showAlert("Passwords do not match.", false);
        return;
      }

      if (cleanId === 'admin' || cleanId === 'librarian@ihmmeerut.ac.in') {
        state.adminPassword = newPassword;
        saveStore(state);
        loginRoleTab = 'ADMIN';
        showAlert("Administrator password updated.");
        navigate('login');
        return;
      }

      const member = state.members.find(m => m.username === cleanId || m.email === cleanId);
      if (member) {
        member.password = newPassword;
        saveStore(state);
        loginRoleTab = 'STUDENT';
        showAlert(`Password updated for ${member.name}.`);
        navigate('login');
      } else {
        showAlert("Account not found.", false);
      }
    }

    function registerNewStudent(form) {
      const name = form.name.value.trim();
      const username = form.username.value.trim();
      const email = form.email.value.trim();
      const phone = form.phone.value.trim();
      const password = form.password.value;

      if (state.members.some(m => m.username === username)) {
        showAlert("Username or Roll No already registered.", false);
        return;
      }

      const newId = Math.max(...state.members.map(m => m.id), 0) + 1;
      state.members.push({ id: newId, name, username, email, phone, password, role: "MEMBER", status: "ACTIVE" });
      saveStore(state);
      loginRoleTab = 'STUDENT';
      showAlert(`Account created for ${name}. Please sign in.`);
      navigate('login');
    }

    function updateStudentProfile(form) {
      const u = state.currentUser;
      const member = state.members.find(m => m.id === u.id);
      if (!member) return;

      member.name = form.name.value.trim();
      member.email = form.email.value.trim();
      member.phone = form.phone.value.trim();

      const newPass = form.newPassword.value;
      if (newPass) {
        if (newPass.length < 4) {
          showAlert("New password must be at least 4 characters long.", false);
          return;
        }
        member.password = newPass;
      }

      state.currentUser = { ...member };
      saveStore(state);
      showAlert("Profile updated successfully!");
      navigate('dashboard');
    }

    function navigate(view) {
      currentView = view;
      updateNavbar();
      const container = document.getElementById("app-container");

      if (view === "login") {
        container.innerHTML = renderLogin();
      } else if (view === "forgotPassword") {
        container.innerHTML = renderForgotPassword();
      } else if (view === "selfRegister") {
        container.innerHTML = renderSelfRegister();
      } else if (!state.currentUser) {
        navigate("login");
      } else if (view === "dashboard") {
        container.innerHTML = state.currentUser.role === 'ADMIN' ? renderAdminDashboard() : renderMemberDashboard();
      } else if (view === "catalog") {
        container.innerHTML = renderCatalog();
      } else if (view === "issueForm") {
        container.innerHTML = renderIssueForm();
      } else if (view === "adminRequests") {
        container.innerHTML = renderAdminRequests();
      } else if (view === "members") {
        container.innerHTML = renderMembers();
      } else if (view === "reports") {
        container.innerHTML = renderReports();
      } else if (view === "studentProfile") {
        container.innerHTML = renderStudentProfile();
      }
    }

    // --- VIEW RENDERERS ---

    function renderLogin() {
      const isStudent = loginRoleTab === 'STUDENT';
      const defaultUser = isStudent ? 'priya_sharma' : 'admin';
      const defaultPass = isStudent ? 'student123' : (state.adminPassword || 'admin123');

      return `
        <div class="max-w-md mx-auto my-8 bg-white rounded-2xl shadow-sm border border-zinc-200/90 overflow-hidden">
          <div class="p-8 pb-6 text-center">
            <div class="w-12 h-12 rounded-2xl bg-zinc-900 text-white flex items-center justify-center mx-auto mb-4 shadow-sm">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <h2 class="text-xl font-bold text-zinc-900 tracking-tight">Sign in to DLMS</h2>
            <p class="text-zinc-500 text-xs mt-1">IHM Meerut Central Library Portal</p>
          </div>

          <div class="px-8">
            <div class="grid grid-cols-2 p-1 rounded-xl bg-zinc-100 border border-zinc-200/60 text-xs font-semibold mb-6">
              <button type="button" onclick="openLoginWithRole('STUDENT')" class="py-2 rounded-lg text-center transition ${isStudent ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-800'}">
                Student
              </button>
              <button type="button" onclick="openLoginWithRole('ADMIN')" class="py-2 rounded-lg text-center transition ${!isStudent ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-800'}">
                Librarian Admin
              </button>
            </div>

            <form onsubmit="event.preventDefault(); login(this.username.value, this.password.value);">
              <div class="mb-4">
                <label class="block text-xs font-semibold text-zinc-700 mb-1.5">
                  ${isStudent ? 'Student Username or Email' : 'Admin Username'}
                </label>
                <input type="text" name="username" value="${defaultUser}" class="w-full px-3.5 py-2.5 bg-zinc-50/50 border border-zinc-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition" required>
              </div>

              <div class="mb-3">
                <label class="block text-xs font-semibold text-zinc-700 mb-1.5">Password</label>
                <div class="relative">
                  <input type="password" id="login-password" name="password" value="${defaultPass}" class="w-full px-3.5 py-2.5 pr-14 bg-zinc-50/50 border border-zinc-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition" required>
                  <button type="button" id="toggle-login-pass" onclick="togglePasswordVisibility('login-password', 'toggle-login-pass')" class="absolute inset-y-0 right-0 px-3.5 flex items-center text-zinc-400 hover:text-zinc-700 text-xs font-semibold">
                    Show
                  </button>
                </div>
              </div>

              <div class="flex justify-between items-center mb-6 text-xs">
                ${isStudent ? `<button type="button" onclick="navigate('selfRegister')" class="font-semibold text-indigo-600 hover:text-indigo-700">Create student account</button>` : '<span></span>'}
                <button type="button" onclick="navigate('forgotPassword')" class="font-medium text-zinc-500 hover:text-zinc-800">Reset password</button>
              </div>

              <button type="submit" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white font-semibold py-2.5 px-4 rounded-xl text-sm shadow-sm transition">
                Continue as ${isStudent ? 'Student' : 'Administrator'}
              </button>
            </form>

            <div class="mt-6 mb-8 p-3.5 bg-zinc-50 border border-zinc-200/80 rounded-xl text-xs text-zinc-600 space-y-1">
              <div class="font-semibold text-zinc-800">Quick Access Credentials</div>
              <div class="flex justify-between"><span>Student:</span> <code class="font-mono text-zinc-800">priya_sharma / student123</code></div>
              <div class="flex justify-between"><span>Admin:</span> <code class="font-mono text-zinc-800">admin / ${state.adminPassword || 'admin123'}</code></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderSelfRegister() {
      return `
        <div class="max-w-md mx-auto my-8 bg-white rounded-2xl shadow-sm border border-zinc-200/90 p-8">
          <div class="mb-6">
            <h2 class="text-xl font-bold text-zinc-900 tracking-tight">Student Registration</h2>
            <p class="text-xs text-zinc-500 mt-1">Create a library member profile to borrow books</p>
          </div>
          <form onsubmit="event.preventDefault(); registerNewStudent(this);" class="space-y-4">
            <div><label class="block text-xs font-semibold text-zinc-700 mb-1">Full Name & Class</label><input type="text" name="name" placeholder="e.g. Anshika Nagar (BCA-V)" class="w-full px-3.5 py-2 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500" required></div>
            <div><label class="block text-xs font-semibold text-zinc-700 mb-1">Username / Roll Number</label><input type="text" name="username" placeholder="e.g. anshika_nagar" class="w-full px-3.5 py-2 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500" required></div>
            <div><label class="block text-xs font-semibold text-zinc-700 mb-1">College Email</label><input type="email" name="email" placeholder="student@ihmmeerut.ac.in" class="w-full px-3.5 py-2 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500" required></div>
            <div><label class="block text-xs font-semibold text-zinc-700 mb-1">Mobile Phone</label><input type="text" name="phone" placeholder="9811223344" class="w-full px-3.5 py-2 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500" required></div>

              <button type="button" onclick="navigate('login')" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-semibold py-2.5 px-4 rounded-xl text-sm">Back</button>

    function renderStudentProfile() {

      return `
        <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-zinc-200/80 p-8">
          <div class="mb-6">

              <button type="button" onclick="navigate('dashboard')" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-semibold py-2.5 px-5 rounded-xl text-sm transition">Cancel</button>

    function renderAdminDashboard() {
      const totalBooks = state.books.length;
      const totalMembers = state.members.length;
      const activeIssues = state.issues.filter(i => i.status !== "RETURNED");
      const pendingReqs = state.requests.filter(r => r.status === 'PENDING').length;
      const totalFines = state.issues.filter(i => i.status === "RETURNED").reduce((sum, i) => sum + (i.fine || 0), 0);

      let rows = activeIssues.map(i => {
        const book = state.books.find(b => b.id === i.bookId) || { title: "Unknown", isbn: "" };
        const member = state.members.find(m => m.id === i.userId) || { name: "Unknown", email: "" };
        const isOverdue = i.status === "OVERDUE";
        return `
          <tr class="hover:bg-zinc-50/80 border-b border-zinc-100 transition-colors">
            <td class="px-5 py-3.5 font-mono text-xs text-zinc-400">#${i.id}</td>
            <td class="px-5 py-3.5"><div class="font-semibold text-zinc-900">${book.title}</div><div class="text-xs text-zinc-400 font-mono mt-0.5">${book.isbn}</div></td>
            <td class="px-5 py-3.5"><div class="font-medium text-zinc-800">${member.name}</div><div class="text-xs text-zinc-400">${member.email}</div></td>
            <td class="px-5 py-3.5 text-xs text-zinc-600">${i.issueDate}</td>
            <td class="px-5 py-3.5 text-xs text-zinc-600">${i.dueDate}</td>
            <td class="px-5 py-3.5">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${isOverdue ? 'bg-rose-50 text-rose-700 border border-rose-200/60' : 'bg-emerald-50 text-emerald-700 border border-emerald-200/60'}">
                ${i.status}
              </span>
            </td>
            <td class="px-5 py-3.5 text-right">
              <button onclick="processDirectReturn(${i.id})" class="bg-white hover:bg-zinc-50 text-zinc-700 border border-zinc-200 text-xs font-semibold px-3 py-1.5 rounded-lg shadow-2xs transition">Mark Returned</button>
            </td>
          </tr>
        `;
      }).join("");

      return `
        <div>
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
              <h1 class="text-2xl font-bold text-zinc-900 tracking-tight">Library Overview</h1>
              <p class="text-zinc-500 text-sm mt-0.5">Real-time circulation metrics and active book loans</p>
            </div>
            <div class="flex items-center space-x-2.5">
              <button onclick="navigate('adminRequests')" class="bg-white hover:bg-zinc-50 text-zinc-800 border border-zinc-200 text-xs font-semibold px-4 py-2.5 rounded-xl shadow-2xs flex items-center space-x-2 transition">
                <span>Approval Queue</span>
                ${pendingReqs > 0 ? `<span class="bg-indigo-600 text-white px-2 py-0.5 rounded-full text-[11px] font-bold">${pendingReqs}</span>` : ''}
              </button>
              <button onclick="navigate('issueForm')" class="bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm transition">+ Issue Book</button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-zinc-200/80 shadow-2xs">
              <p class="text-xs font-semibold text-zinc-500">Catalog Titles</p>
              <p class="text-3xl font-extrabold text-zinc-900 mt-2 tracking-tight">${totalBooks}</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-zinc-200/80 shadow-2xs">
              <p class="text-xs font-semibold text-zinc-500">Active Members</p>
              <p class="text-3xl font-extrabold text-zinc-900 mt-2 tracking-tight">${totalMembers}</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-zinc-200/80 shadow-2xs">
              <p class="text-xs font-semibold text-zinc-500">Books Checked Out</p>
              <p class="text-3xl font-extrabold text-indigo-600 mt-2 tracking-tight">${activeIssues.length}</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-zinc-200/80 shadow-2xs">
              <p class="text-xs font-semibold text-zinc-500">Settled Fines</p>
              <p class="text-3xl font-extrabold text-emerald-600 mt-2 tracking-tight">₹${totalFines.toFixed(0)}</p>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-zinc-200/80 shadow-2xs overflow-hidden">
            <div class="px-6 py-4 border-b border-zinc-100 flex justify-between items-center">
              <h2 class="text-sm font-bold text-zinc-900">Active Circulation</h2>
              <span class="text-xs text-zinc-400 font-medium">${activeIssues.length} active loans</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="bg-zinc-50/70 text-zinc-500 text-[11px] uppercase tracking-wider font-semibold border-b border-zinc-100">
                  <tr>
                    <th class="px-5 py-3">ID</th>
                    <th class="px-5 py-3">Book</th>
                    <th class="px-5 py-3">Borrower</th>
                    <th class="px-5 py-3">Issued</th>
                    <th class="px-5 py-3">Due</th>
                    <th class="px-5 py-3">Status</th>
                    <th class="px-5 py-3 text-right">Action</th>
                  </tr>
                </thead>
                <tbody>${rows.length > 0 ? rows : '<tr><td colspan="7" class="text-center py-10 text-zinc-400 text-sm">No active book loans at the moment.</td></tr>'}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderMemberDashboard() {
      const myIssues = state.issues.filter(i => i.userId === state.currentUser.id);
      const myRequests = state.requests.filter(r => r.userId === state.currentUser.id);

      let issueRows = myIssues.map(i => {
        const book = state.books.find(b => b.id === i.bookId) || { title: "Unknown", isbn: "" };
        const isReturned = i.status === "RETURNED";
        const hasActiveReturnReq = myRequests.some(r => r.bookId === i.bookId && r.type === 'RETURN' && r.status === 'PENDING');

        return `
          <tr class="hover:bg-zinc-50/80 border-b border-zinc-100 transition-colors">
            <td class="px-5 py-3.5 font-mono text-xs text-zinc-400">#${i.id}</td>
            <td class="px-5 py-3.5 font-semibold text-zinc-900">${book.title}</td>
            <td class="px-5 py-3.5 text-xs text-zinc-600">${i.issueDate}</td>
            <td class="px-5 py-3.5 text-xs text-zinc-600">${i.dueDate}</td>
            <td class="px-5 py-3.5 text-xs font-semibold ${i.fine > 0 ? 'text-rose-600' : 'text-zinc-600'}">₹${i.fine.toFixed(0)}</td>
            <td class="px-5 py-3.5">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${isReturned ? 'bg-zinc-100 text-zinc-600' : 'bg-emerald-50 text-emerald-700 border border-emerald-200/60'}">${i.status}</span>
            </td>
            <td class="px-5 py-3.5 text-right">
              ${!isReturned ? (hasActiveReturnReq ? '<span class="text-xs text-amber-600 font-semibold">Return Pending Approval</span>' : `<button onclick="requestReturnBook(${i.bookId}, ${i.id})" class="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200/80 text-xs font-semibold px-3 py-1.5 rounded-lg transition">Request Return</button>`) : '<span class="text-xs text-zinc-400">Completed</span>'}
            </td>
          </tr>
        `;
      }).join("");

      let reqRows = myRequests.map(r => {
        const book = state.books.find(b => b.id === r.bookId) || { title: "Unknown" };
        let badgeStyle = 'bg-amber-50 text-amber-700 border border-amber-200/60';
        if (r.status === 'APPROVED') badgeStyle = 'bg-emerald-50 text-emerald-700 border border-emerald-200/60';
        if (r.status === 'REJECTED') badgeStyle = 'bg-rose-50 text-rose-700 border border-rose-200/60';

        return `
          <tr class="hover:bg-zinc-50/80 border-b border-zinc-100 transition-colors">
            <td class="px-5 py-3.5 text-xs font-mono text-zinc-500">#REQ-${r.id}</td>
            <td class="px-5 py-3.5 font-semibold text-zinc-900">${book.title}</td>
            <td class="px-5 py-3.5"><span class="px-2.5 py-0.5 rounded-md text-xs font-semibold ${r.type === 'BORROW' ? 'bg-indigo-50 text-indigo-700' : 'bg-orange-50 text-orange-700'}">${r.type}</span></td>
            <td class="px-5 py-3.5 text-xs text-zinc-500">${r.date}</td>
            <td class="px-5 py-3.5"><span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${badgeStyle}">${r.status}</span></td>
          </tr>
        `;
      }).join("");

      return `
        <div>
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
              <h1 class="text-2xl font-bold text-zinc-900 tracking-tight">Welcome, ${state.currentUser.name.split('(')[0].trim()}</h1>
              <p class="text-zinc-500 text-sm mt-0.5">Manage your borrowed books and track approval requests</p>
            </div>
            <div class="flex space-x-2">
              <button onclick="window.print()" class="bg-white hover:bg-zinc-50 text-zinc-800 border border-zinc-200 text-xs font-semibold px-4 py-2.5 rounded-xl shadow-2xs transition">Print / Export Slip</button>
              <button onclick="navigate('catalog')" class="bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm transition">Explore Book Catalog →</button>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-zinc-200/80 shadow-2xs overflow-hidden mb-8">
            <div class="px-6 py-4 border-b border-zinc-100"><h2 class="text-sm font-bold text-zinc-900">Your Borrowing History</h2></div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="bg-zinc-50/70 text-zinc-500 text-[11px] uppercase tracking-wider font-semibold border-b border-zinc-100">
                  <tr><th class="px-5 py-3">ID</th><th class="px-5 py-3">Book Title</th><th class="px-5 py-3">Issued</th><th class="px-5 py-3">Due</th><th class="px-5 py-3">Fine</th><th class="px-5 py-3">Status</th><th class="px-5 py-3 text-right">Action</th></tr>
                </thead>
                <tbody>${issueRows.length > 0 ? issueRows : '<tr><td colspan="7" class="text-center py-8 text-zinc-400">You have not borrowed any books yet.</td></tr>'}</tbody>
              </table>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-zinc-200/80 shadow-2xs overflow-hidden">
            <div class="px-6 py-4 border-b border-zinc-100"><h2 class="text-sm font-bold text-zinc-900">Submitted Requests</h2></div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="bg-zinc-50/70 text-zinc-500 text-[11px] uppercase tracking-wider font-semibold border-b border-zinc-100">
                  <tr><th class="px-5 py-3">Request ID</th><th class="px-5 py-3">Book Title</th><th class="px-5 py-3">Type</th><th class="px-5 py-3">Date</th><th class="px-5 py-3">Approval Status</th></tr>
                </thead>
                <tbody>${reqRows.length > 0 ? reqRows : '<tr><td colspan="5" class="text-center py-8 text-zinc-400">No requests submitted yet.</td></tr>'}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderCatalog() {
      const u = state.currentUser;
      const isAdmin = u && u.role === 'ADMIN';

      let filtered = state.books.filter(b => {
        const matchesCat = catalogCat === 0 || b.categoryId === catalogCat;
        const matchesKey = !catalogKeyword || b.title.toLowerCase().includes(catalogKeyword) || b.author.toLowerCase().includes(catalogKeyword) || b.isbn.toLowerCase().includes(catalogKeyword);
        return matchesCat && matchesKey;
      });

      let bookRows = filtered.map(b => {
        const cat = state.categories.find(c => c.id === b.categoryId) || { name: "General" };
        const hasStock = b.available > 0;
        const hasPendingBorrow = !isAdmin && state.requests.some(r => r.userId === u.id && r.bookId === b.id && r.type === 'BORROW' && r.status === 'PENDING');
        const coverUrl = `https://covers.openlibrary.org/b/isbn/${b.isbn.replace(/-/g, '')}-S.jpg`;

        return `
          <tr class="hover:bg-zinc-50/80 border-b border-zinc-100 transition-colors">
            <td class="px-5 py-4">
              <img src="${coverUrl}" alt="Cover" class="w-10 h-14 object-cover rounded shadow-2xs bg-zinc-100 border border-zinc-200" onerror="this.src='https://placehold.co/40x56?text=DLMS'">
            </td>
            <td class="px-5 py-4">
              <div class="font-semibold text-zinc-900">${b.title}</div>
              <div class="text-xs text-zinc-500 mt-0.5">${b.author} • <span class="text-zinc-400">${b.edition}</span></div>
              <div class="text-[11px] font-mono text-zinc-400 mt-0.5">${b.isbn}</div>
            </td>
            <td class="px-5 py-4"><span class="px-2.5 py-1 rounded-lg text-xs font-medium bg-zinc-100 text-zinc-700">${cat.name}</span></td>
            <td class="px-5 py-4 text-xs text-zinc-600 font-medium">${b.shelf}</td>
            <td class="px-5 py-4">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${hasStock ? 'bg-emerald-50 text-emerald-700 border border-emerald-200/60' : 'bg-rose-50 text-rose-700 border border-rose-200/60'}">
                ${hasStock ? `${b.available} of ${b.total} available` : 'Out of stock'}
              </span>
            </td>
            <td class="px-5 py-4 text-right">
              ${isAdmin ? `<button onclick="deleteBook(${b.id})" class="text-xs text-rose-600 hover:bg-rose-50 px-2.5 py-1.5 rounded-lg font-semibold transition">Remove</button>` : 
                (hasPendingBorrow ? '<span class="text-xs text-amber-600 font-semibold bg-amber-50 px-2.5 py-1 rounded-lg">Pending Approval</span>' : 
                  (hasStock ? `<button onclick="requestBorrowBook(${b.id})" class="bg-zinc-900 hover:bg-indigo-600 text-white text-xs font-semibold px-3.5 py-1.5 rounded-lg shadow-2xs transition">Request Borrow</button>` : '<span class="text-xs text-zinc-400">Unavailable</span>'))}
            </td>
          </tr>
        `;
      }).join("");

      let catOptions = state.categories.map(c => `<option value="${c.id}" ${catalogCat === c.id ? 'selected' : ''}>${c.name}</option>`).join("");

      return `
        <div>
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-zinc-900 tracking-tight">Library Catalog</h1>
            <p class="text-zinc-500 text-sm mt-0.5">Browse available academic volumes and submit borrow requests</p>
          </div>

          <div class="bg-white p-4 rounded-2xl border border-zinc-200/80 shadow-2xs mb-6">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <div class="sm:col-span-2">
                <input type="text" id="cat-search" value="${catalogKeyword}" placeholder="Search by title, author, or ISBN..." class="w-full px-3.5 py-2 bg-zinc-50/50 border border-zinc-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-indigo-500" onkeyup="if(event.key==='Enter') applyCatalogFilter()">
              </div>
              <div>
                <select id="cat-select" class="w-full px-3.5 py-2 bg-zinc-50/50 border border-zinc-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-indigo-500" onchange="applyCatalogFilter()">
                  <option value="0">All Categories</option>
                  ${catOptions}
                </select>
              </div>
              <div>
                <button onclick="applyCatalogFilter()" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white font-semibold py-2 rounded-xl text-sm transition">Search Catalog</button>
              </div>
            </div>
          </div>

          ${isAdmin ? `
          <div class="bg-white p-5 rounded-2xl border border-zinc-200/80 shadow-2xs mb-6">
            <h2 class="text-xs font-bold text-zinc-800 uppercase tracking-wider mb-4">Add New Volume to Inventory</h2>
            <form onsubmit="event.preventDefault(); addNewBook(this);">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                <div><label class="block text-xs font-semibold text-zinc-600 mb-1">ISBN</label><input type="text" name="isbn" placeholder="978-..." class="w-full px-3 py-2 border border-zinc-200 rounded-xl text-xs" required></div>
                <div><label class="block text-xs font-semibold text-zinc-600 mb-1">Book Title</label><input type="text" name="title" placeholder="Title" class="w-full px-3 py-2 border border-zinc-200 rounded-xl text-xs" required></div>
                <div><label class="block text-xs font-semibold text-zinc-600 mb-1">Author</label><input type="text" name="author" placeholder="Author" class="w-full px-3 py-2 border border-zinc-200 rounded-xl text-xs" required></div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-4">

              </table>

    function renderMembers() {
      let rows = state.members.map(m => `
        <tr class="hover:bg-zinc-50/80 border-b border-zinc-100 transition-colors">

          <td class="px-5 py-3.5 text-xs font-mono text-zinc-500">${m.username}</td>
          <td class="px-5 py-3.5 text-xs text-zinc-600">${m.email}</td>
          <td class="px-5 py-3.5 text-xs text-zinc-600">${m.phone}</td>
          <td class="px-5 py-3.5"><span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/60">${m.status}</span></td>

            <h2 class="text-xs font-bold text-zinc-800 uppercase tracking-wider mb-4">Register New Member</h2>
            <form onsubmit="event.preventDefault(); registerMemberFromAdmin(this);">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">

                <div><label class="block text-xs font-semibold text-zinc-600 mb-1">Username / Roll</label><input type="text" name="username" class="w-full px-3 py-2 border border-zinc-200 rounded-xl text-xs" required></div>
                <div><label class="block text-xs font-semibold text-zinc-600 mb-1">Email</label><input type="email" name="email" class="w-full px-3 py-2 border border-zinc-200 rounded-xl text-xs" required></div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div><label class="block text-xs font-semibold text-zinc-600 mb-1">Phone</label><input type="text" name="phone" class="w-full px-3 py-2 border border-zinc-200 rounded-xl text-xs" required></div>
                <div><label class="block text-xs font-semibold text-zinc-600 mb-1">Default Password</label><input type="text" name="password" value="student123" class="w-full px-3 py-2 border border-zinc-200 rounded-xl text-xs" required></div>
                <div class="flex items-end"><button type="submit" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white font-semibold py-2 rounded-xl text-xs transition">+ Add Member</button></div>
              </div>
            </form>
          </div>

          <div class="bg-white rounded-2xl border border-zinc-200/80 shadow-2xs overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="bg-zinc-50/70 text-zinc-500 text-[11px] uppercase tracking-wider font-semibold border-b border-zinc-100">
                  <tr><th class="px-5 py-3">ID</th><th class="px-5 py-3">Name</th><th class="px-5 py-3">Username</th><th class="px-5 py-3">Email</th><th class="px-5 py-3">Phone</th><th class="px-5 py-3">Status</th></tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderReports() {
      let rows = state.issues.map(i => {
        const book = state.books.find(b => b.id === i.bookId) || { title: "Unknown", isbn: "" };
        const member = state.members.find(m => m.id === i.userId) || { name: "Unknown" };
        return `
          <tr class="hover:bg-zinc-50/80 border-b border-zinc-100 transition-colors">
            <td class="px-5 py-3.5 font-mono text-xs text-zinc-400">#${i.id}</td>
            <td class="px-5 py-3.5 font-semibold text-zinc-900">${book.title}</td>
            <td class="px-5 py-3.5 text-xs font-mono text-zinc-500">${book.isbn}</td>
            <td class="px-5 py-3.5 text-xs text-zinc-700">${member.name}</td>
            <td class="px-5 py-3.5 text-xs text-zinc-500">${i.issueDate}</td>
            <td class="px-5 py-3.5 text-xs text-zinc-500">${i.dueDate}</td>
            <td class="px-5 py-3.5 text-xs text-zinc-500">${i.returnDate || '<span class="text-zinc-400 italic">Active</span>'}</td>
            <td class="px-5 py-3.5 text-xs font-semibold text-zinc-800">₹${i.fine.toFixed(0)}</td>
            <td class="px-5 py-3.5"><span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${i.status === 'RETURNED' ? 'bg-zinc-100 text-zinc-600' : 'bg-emerald-50 text-emerald-700'}">${i.status}</span></td>
          </tr>
        `;
      }).join("");

      return `
        <div>
          <div class="flex justify-between items-center mb-6">
            <div>
              <h1 class="text-2xl font-bold text-zinc-900 tracking-tight">Circulation Audit Log</h1>
              <p class="text-zinc-500 text-sm mt-0.5">Complete ledger of historical and active library transactions</p>
            </div>
            <button onclick="window.print()" class="bg-white hover:bg-zinc-50 text-zinc-800 border border-zinc-200 text-xs font-semibold px-4 py-2 rounded-xl shadow-2xs transition">Export / Print</button>
          </div>
          <div class="bg-white rounded-2xl border border-zinc-200/80 shadow-2xs overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="bg-zinc-50/70 text-zinc-500 text-[11px] uppercase tracking-wider font-semibold border-b border-zinc-100">

                </thead>

              </table>

    // --- WORKFLOW ACTIONS ---

    function applyCatalogFilter() {
      catalogKeyword = (document.getElementById("cat-search").value || "").toLowerCase().trim();
      catalogCat = parseInt(document.getElementById("cat-select").value) || 0;
      navigate("catalog");
    }

    function addNewBook(form) {
      const newId = Math.max(...state.books.map(b => b.id), 0) + 1;
      const copies = parseInt(form.total.value);
      state.books.push({
        id: newId, isbn: form.isbn.value, title: form.title.value, author: form.author.value,
        publisher: form.publisher.value, edition: "1st Edition", categoryId: parseInt(form.categoryId.value),
        total: copies, available: copies, shelf: form.shelf.value
      });
      saveStore(state);
      showAlert(`Added "${form.title.value}" to catalog.`);
      navigate("catalog");
    }

    function deleteBook(id) {
      if (confirm(`Remove book #${id} from catalog?`)) {
        state.books = state.books.filter(b => b.id !== id);
        saveStore(state);
        showAlert(`Book removed.`);
        navigate("catalog");
      }
    }

    function requestBorrowBook(bookId) {
      const u = state.currentUser;
      const book = state.books.find(b => b.id === bookId);
      if (!book || book.available <= 0) {
        showAlert("This book is currently out of stock.", false);
        return;
      }

      // Rule 1: Check if user has any overdue books
      const hasOverdue = state.issues.some(i => i.userId === u.id && i.status === 'OVERDUE');
      if (hasOverdue) {
        showAlert("Cannot request: You have overdue books or pending fines on your account.", false);
        return;
      }

      // Rule 2: Check if user already reached max 3 active borrowed books
      const activeCount = state.issues.filter(i => i.userId === u.id && i.status !== 'RETURNED').length;
      if (activeCount >= 3) {
        showAlert("Borrow limit reached: You can only have a maximum of 3 active books at a time.", false);
        return;
      }
      
      const existingReq = state.requests.find(r => r.userId === u.id && r.bookId === bookId && r.status === 'PENDING');
      if (existingReq) {
        showAlert("You already have a pending borrow request for this book.", false);
        return;
      }

      const newReqId = Math.max(...state.requests.map(r => r.id), 0) + 1;
      state.requests.push({
        id: newReqId,
        bookId: bookId,
        userId: u.id,
        type: 'BORROW',
        status: 'PENDING',
        date: new Date().toISOString().split("T")[0]
      });
      saveStore(state);
      showAlert("Borrow request submitted to librarian.");
      navigate("catalog");
    }

    function requestReturnBook(bookId, issueId) {
      const u = state.currentUser;
      const existingReq = state.requests.find(r => r.userId === u.id && r.bookId === bookId && r.type === 'RETURN' && r.status === 'PENDING');
      if (existingReq) {
        showAlert("You already have a pending return request for this book.", false);
        return;
      }

      const newReqId = Math.max(...state.requests.map(r => r.id), 0) + 1;
      state.requests.push({
        id: newReqId,
        bookId: bookId,
        userId: u.id,
        issueId: issueId,
        type: 'RETURN',
        status: 'PENDING',
        date: new Date().toISOString().split("T")[0]
      });
      saveStore(state);
      showAlert("Return request submitted to librarian.");
      navigate("dashboard");
    }

    function approveRequest(reqId) {
      const req = state.requests.find(r => r.id === reqId);
      if (!req || req.status !== 'PENDING') return;

      if (req.type === 'BORROW') {
        const book = state.books.find(b => b.id === req.bookId);
        if (!book || book.available <= 0) {
          showAlert("Cannot approve: Book is out of stock.", false);
          return;
        }
        book.available--;
        const newIssueId = Math.max(...state.issues.map(i => i.id), 0) + 1;
        const today = new Date();
        const dueDate = new Date();
        dueDate.setDate(today.getDate() + 14);

        state.issues.unshift({
          id: newIssueId,
          bookId: req.bookId,
          userId: req.userId,
          issueDate: today.toISOString().split("T")[0],
          dueDate: dueDate.toISOString().split("T")[0],
          returnDate: null,
          fine: 0.00,
          status: "ISSUED",
          remarks: "Approved student borrow request"
        });
        req.status = 'APPROVED';
        showAlert(`Borrow request approved and book issued.`);
      } else if (req.type === 'RETURN') {
        const issue = state.issues.find(i => i.id === req.issueId && i.status !== 'RETURNED');
        if (issue) {
          const today = new Date();
          const dueDate = new Date(issue.dueDate);
          const diffTime = today - dueDate;
          const overdueDays = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
          const fine = overdueDays * 5.00;

          issue.returnDate = today.toISOString().split("T")[0];
          issue.fine = fine;
          issue.status = "RETURNED";
          issue.remarks = overdueDays > 0 ? `Returned late via request; Fine: ₹${fine}` : "Returned on schedule via request";

          const book = state.books.find(b => b.id === issue.bookId);
          if (book) book.available++;
        }
        req.status = 'APPROVED';
        showAlert(`Return request approved and stock restored.`);
      }

      saveStore(state);
      navigate("adminRequests");
    }

    function rejectRequest(reqId) {
      const req = state.requests.find(r => r.id === reqId);
      if (req) {
        req.status = 'REJECTED';
        saveStore(state);
        showAlert(`Request #${reqId} declined.`);
        navigate("adminRequests");
      }
    }

    function issueBookDirect(bookIdStr, memberIdStr, daysStr) {
      const bookId = parseInt(bookIdStr);
      const memberId = parseInt(memberIdStr);
      const days = parseInt(daysStr) || 14;

      const book = state.books.find(b => b.id === bookId);
      if (!book || book.available <= 0) {
        showAlert("Book is out of stock.", false);
        return;
      }
      book.available--;
      const newIssueId = Math.max(...state.issues.map(i => i.id), 0) + 1;
      const today = new Date();
      const dueDate = new Date();
      dueDate.setDate(today.getDate() + days);

      state.issues.unshift({
        id: newIssueId, bookId, userId: memberId,
        issueDate: today.toISOString().split("T")[0],
        dueDate: dueDate.toISOString().split("T")[0],
        returnDate: null, fine: 0.00, status: "ISSUED", remarks: "Direct admin checkout"
      });
      saveStore(state);
      showAlert("Book checked out successfully.");
      navigate("dashboard");
    }

    function processDirectReturn(issueId) {
      const issue = state.issues.find(i => i.id === issueId);
      if (!issue || issue.status === "RETURNED") return;

      const today = new Date();
      const dueDate = new Date(issue.dueDate);
      const diffTime = today - dueDate;
      const overdueDays = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
      const fine = overdueDays * 5.00;

      issue.returnDate = today.toISOString().split("T")[0];
      issue.fine = fine;
      issue.status = "RETURNED";
      issue.remarks = overdueDays > 0 ? `Returned ${overdueDays} days late; Fine: ₹${fine}` : "Returned on schedule";

      const book = state.books.find(b => b.id === issue.bookId);
      if (book) book.available++;

      saveStore(state);
      showAlert(`Book returned. Fine settled: ₹${fine}`);
      navigate("dashboard");
    }

    function registerMemberFromAdmin(form) {
      const newId = Math.max(...state.members.map(m => m.id), 0) + 1;
      state.members.push({
        id: newId, name: form.name.value, username: form.username.value,
        email: form.email.value, phone: form.phone.value, password: form.password.value,
        role: "MEMBER", status: "ACTIVE"
      });
      saveStore(state);
      showAlert(`Member added.`);
      navigate("members");
    }

    // Initialize application
    navigate("dashboard");
  </script>
